name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run tauri build -- --bundles nsis

      - name: Prepare files
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          Copy-Item $installer.FullName "POTG-setup.exe"
          $hash = (Get-FileHash "POTG-setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  POTG-setup.exe" | Out-File -Encoding ascii "POTG-setup.exe.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: POTG-windows
          path: |
            POTG-setup.exe
            POTG-setup.exe.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            POTG-setup.exe
            POTG-setup.exe.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Download POTG-setup.exe and run it.

            Windows may show a SmartScreen warning because the installer is not code signed yet. Choose More info, then Run anyway.

            The SHA-256 checksum is in POTG-setup.exe.sha256.
