name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-8.1.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-dl
          $root = Get-ChildItem ffmpeg-dl -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          $target = "src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe"
          Copy-Item "$($root.FullName)/bin/ffmpeg.exe" $target
          & $target -version
          $filters = & $target -hide_banner -filters
          if (-not ($filters | Select-String "ddagrab")) { throw "This FFmpeg build has no ddagrab screen capture filter" }
          & $target -hide_banner -encoders | Select-String "nvenc|amf|qsv|h264_mf"

      - name: Build installer
        run: npm run tauri build -- --bundles nsis --config src-tauri/tauri.release.conf.json

      - name: Prepare files
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          Copy-Item $installer.FullName "POTG-setup.exe"
          $hash = (Get-FileHash "POTG-setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  POTG-setup.exe" | Out-File -Encoding ascii "POTG-setup.exe.sha256"
          "Installer size: {0:N1} MB" -f ((Get-Item "POTG-setup.exe").Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: POTG-windows
          path: |
            POTG-setup.exe
            POTG-setup.exe.sha256
            THIRD-PARTY-NOTICES.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            POTG-setup.exe
            POTG-setup.exe.sha256
            THIRD-PARTY-NOTICES.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Download POTG-setup.exe and run it. FFmpeg is included, so there is nothing else to install for recording and trimming.

            Windows may show a SmartScreen warning because the installer is not code signed yet. Choose More info, then Run anyway.

            The SHA-256 checksum is in POTG-setup.exe.sha256. Third-party license information is in THIRD-PARTY-NOTICES.md.
